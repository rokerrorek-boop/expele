<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><meta name="theme-color" content="#101116"><title>Expele — nowe hasło</title><style>
:root{color-scheme:dark;--bg:#101116;--panel:#17191f;--line:#30343b;--muted:#a1a6b0;--accent:#c4f76b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#263322 0,transparent 55%),var(--bg);color:#f3f5f0;font:16px/1.5 system-ui,sans-serif;min-height:100vh}header{padding:24px max(20px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:var(--accent);text-decoration:none}.brand{font-weight:900;color:#f3f5f0;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;background:var(--accent);color:#101116;border-radius:9px;width:36px;height:36px;font-weight:950}main{max-width:480px;margin:8vh auto 30px;padding:0 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,36px);box-shadow:0 20px 60px #0005}.eyebrow{font:700 12px monospace;letter-spacing:1px;color:var(--accent)}h1{font-size:clamp(30px,7vw,42px);line-height:1.1;letter-spacing:-.05em;margin:12px 0}p{color:var(--muted);overflow-wrap:anywhere}button{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:50px;border-radius:9px;border:1px solid var(--line);background:var(--accent);color:#101116;font:700 15px system-ui;cursor:pointer;margin:16px 0}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}#discord{background:#5865f2;color:white}#logout{background:transparent;color:#f3f5f0}#status{font-size:14px;white-space:pre-wrap;min-height:24px}#status.error{color:#ffaaaa}#status.ok{color:var(--accent)}[hidden]{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}small{color:var(--muted)}
input{width:100%;background:#101116;border:1px solid var(--line);border-radius:9px;padding:13px;color:#f3f5f0;font:inherit;margin:5px 0 12px}label{font-size:14px;color:#e1e4dc}input:focus-visible{outline:2px solid var(--accent)}.secondary{background:transparent;color:#f3f5f0}.split{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:22px 0}.split:before,.split:after{content:'';height:1px;flex:1;background:var(--line)}.links{display:flex;flex-wrap:wrap;gap:10px}.links button{flex:1;font-size:13px;min-height:42px;margin:0}.hint{font-size:13px}fieldset{border:0;padding:0;margin:0;min-width:0}</style></head>
<body><header><a href="/" class="brand"><span class="mark">E</span> EXPELE / ARCADE</a><a href="/login.html">← Logowanie</a></header><main><section class="panel"><div class="eyebrow">AUTH / RECOVERY</div><h1>Ustaw nowe hasło.</h1><p>Nowe hasło, nowy respawn. Wpisz co najmniej 12 znaków.</p>
<form id="reset" hidden><fieldset id="fields"><label for="pw">Nowe hasło</label><input id="pw" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><label for="repeat">Powtórz nowe hasło</label><input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><button type="submit">Zapisz nowe hasło</button></fieldset></form><p id="status" role="status" aria-live="polite"></p><a href="/login.html">Wróć do logowania / poproś o nowy link</a></section></main><footer>Created by Expele. Powered by ziemniak.</footer>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), form=$('reset');
const show=(msg,type='')=>{$('status').textContent=msg;$('status').className=type;};
const url=new URL(location.href);
let token=url.searchParams.get('token_hash');
const type=url.searchParams.get('type');
if(url.search || url.hash) history.replaceState(null,'',url.pathname);
if(location.origin!=='https://expele.pl'){show('Otwórz link na https://expele.pl.','error');return;}
if(!token || type!=='recovery'){show('Brak ważnego linku resetowania. Poproś o nową wiadomość.','error');return;}
const endpoint='https://gmnjusezghlpwfbuyjvc.supabase.co/auth/v1';
const key='sb_publishable_7Yk8CCi_pitbKCxRlQnmUQ_x4OCFOAX';
let access=null, busy=false;
async function request(path,method,body,bearer){
  const headers={'apikey':key,'Content-Type':'application/json'};
  if(bearer) headers.Authorization='Bearer '+bearer;
  const response=await fetch(endpoint+path,{method,headers,body:JSON.stringify(body),cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(25000)});
  const payload=await response.json().catch(()=>({}));
  if(!response.ok) {const e=new Error(payload.msg||payload.message||payload.error_description||'Błąd połączenia ('+response.status+').');e.code=payload.error_code||payload.code;e.http=response.status;throw e;}
  return payload;
}
form.hidden=false;show('Wpisz nowe hasło, aby wykorzystać jednorazowy link.');
form.addEventListener('submit',async e=>{
 e.preventDefault();if(busy)return;
 const password=$('pw').value;
 if(password!==$('repeat').value){show('Hasła nie są identyczne.','error');return;}
 if(new TextEncoder().encode(password).length>72){show('Hasło jest zbyt długie (maks. 72 bajty UTF-8).','error');return;}
 busy=true;$('fields').disabled=true;show('Weryfikowanie linku i zapisywanie hasła…');
 try{
  if(!access){
    const data=await request('/verify','POST',{token_hash:token,type:'recovery'});
    if(typeof data.access_token!=='string')throw new Error('Brak sesji resetowania. Poproś o nowy link.');
    access=data.access_token;token=null;
  }
  await request('/user','PUT',{password},access);
  access=null;form.reset();form.hidden=true;
  document.querySelector('h1').textContent='Hasło zmienione!';
  show('Gotowe. Wróć do logowania i użyj nowego hasła.','ok');
 }catch(error){
  if(error.code==='otp_expired'||error.code==='bad_jwt'||error.code==='session_expired'||error.http===401){token=null;access=null;form.reset();form.hidden=true;show('Link wygasł, został już użyty lub sesja jest nieaktualna. Poproś o nowy link.','error');}
  else show('Nie udało się zmienić hasła: '+error.message+' Jeśli link został wykorzystany, poproś o nowy.','error');
 }finally{busy=false;$('fields').disabled=false;}
});
})();
</script></body></html>
